# Install as .github/workflows/docs-preview.yml in a repository registered as a
# remote documentation source in ClickHouse/mintlify-docs-dev/remotes.json.
#
# A maintainer approves a pull request by adding the `docs-preview` label. This
# uses pull_request_target so organization secrets are available for fork PRs,
# but neither this caller nor the shared workflow checks out or executes PR
# code. Vercel Connect fetches the approved remote revision inside the build.
name: Preview documentation

run-name: Preview documentation for PR #${{ github.event.pull_request.number }}

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.label.name == 'docs-preview'
    uses: ClickHouse/integrations-shared-workflows/.github/workflows/remote-docs-preview.yml@main
    with:
      # This must match the source's name in the central remotes.json registry.
      remote_name: clickhouse-private
      pull_request_number: ${{ github.event.pull_request.number }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
