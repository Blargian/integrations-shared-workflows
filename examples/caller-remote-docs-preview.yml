# Install as .github/workflows/docs-preview.yml in a repository registered as a
# remote documentation source in ClickHouse/mintlify-docs-dev/remotes.json.
#
# A maintainer enables previews for a pull request by adding the `docs-preview`
# label. While the label remains, each new commit refreshes the preview. This
# uses pull_request_target so organization secrets are available for fork PRs,
# but neither this caller nor the shared workflow checks out or executes PR
# code. Vercel Connect fetches the base repository's PR ref inside the build.
name: Preview documentation

run-name: Preview documentation for PR #${{ github.event.pull_request.number }}

on:
  pull_request_target:
    types: [labeled, synchronize]
    # Configure this for the directory exported by this repository. Remove the
    # paths filter if every pull request should be eligible for a docs preview.
    paths:
      - "docs/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Both conditions must hold: the PR changes the configured paths above and
    # a maintainer has enabled previews by applying docs-preview.
    if: contains(github.event.pull_request.labels.*.name, 'docs-preview')
    uses: ClickHouse/integrations-shared-workflows/.github/workflows/remote-docs-preview.yml@main
    with:
      # This must match the source's name in the central remotes.json registry.
      remote_name: clickhouse-private
      pull_request_number: ${{ github.event.pull_request.number }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
